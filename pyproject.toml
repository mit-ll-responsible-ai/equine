[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "equine"
dynamic = ["version"]
authors = [
    { name = "Allan Wollaber"},
    { name = "Steven Jorgensen"},
    { name = "John Holodnak" },
    { name = "Jensen Dempsey" },
    { name = "Harry Li" },
]
maintainers = [
    { name = "Allan Wollaber"}, 
    { name = "Steven Jorgensen"},
]
description = "EQUINE^2: Establishing Quantified Uncertainty for Neural Networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
        "torch >= 2.14.1, < 3.0.0",
        "torchmetrics >= 1.2.1",
        "numpy >= 2.0.0, < 3.0.0",
        "tqdm >= 4.66.3",
        "beartype >= 0.22.1",
        "beartype >= 0.23.0; python_version >= '3.15'",
        "icontract >= 2.6.2",
        "scipy >= 1.13.0",
]
license = "MIT"
license-files = ["LICENSE.md"]
keywords = ["machine learning", "robustness", "pytorch", "responsible", "AI"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
tests = [
    "pytest >= 7.3.2",
    "pytest-cov >= 4.0.0",
    "pytest-xdist >= 3.0.2",
    "hypothesis >= 6.105.0, < 6.166.0",
]

dev = [
    "equine[tests]",
    "pre-commit >= 2.19",
    "codespell >= 2.4.3",
]

docs = [
    "mkdocs>=1.3",
    "mkdocs-material",
    "mkdocstrings>=1.0.7",
    "mkdocstrings-python",
    "mkdocs-jupyter",
    "mkdocs-literate-nav",
    "mkdocs-gen-files",
    "mkdocs-section-index",
]

[project.urls]
"Homepage" = "https://mit-ll-responsible-ai.github.io/equine/"
"Bug Tracker" = "https://github.com/mit-ll-responsible-ai/equine/issues"
"Source" = "https://github.com/mit-ll-responsible-ai/equine"

[tool.setuptools_scm]
version_file = "src/equine/_version.py"
#version_scheme = "no-guess-dev"

[tool.setuptools.package-data]
equine = ["py.typed"]

[tool.ruff]
line-length = 88
extend-exclude = ["src/equine/_version.py"]

[tool.ruff.lint]
# E/W (pycodestyle) + F (pyflakes) reproduce the previous flake8 checks and
# I (isort) replaces the standalone isort step. The unused-import/variable
# cleanup that autoflake handled is covered by F401/F841.
select = ["E", "F", "W", "I"]
# Mirror the rule exemptions from the previous .flake8 config. E501 (line
# length) and E203 (whitespace before punctuation) are also handled by, or
# conflict with, the formatter.
ignore = ["E203", "E501", "E701", "E721", "F403", "F405", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["equine", "tests"]
known-third-party = [
    "torch",
    "torchmetrics",
    "numpy",
    "tqdm",
    "beartype",
    "icontract",
    "scikit-learn",
    "scipy",
]
combine-as-imports = true

[tool.pytest.ini_options]
addopts = "--durations=0"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
omit = ["src/equine/_version.py"]
exclude_lines = [
       'pragma: no cover',
       'def __repr__',
       '@(abc\.)?abstractmethod',
       '@(typing\.)?overload',
       'except ImportError:',
       'except ModuleNotFoundError:',
       'if (typing\.)?TYPE_CHECKING:',
       'if sys\.version_info',
]

[tool.pyright]
include = ["src"]
exclude = [
       "**/node_modules",
       "**/__pycache__",
       "src/equine/_version.py",
       "**/.hypothesis",
       "**/docs",
       "**/.tox",
]
reportUnnecessaryTypeIgnoreComment = true
reportUnnecessaryIsInstance = false

[tool.codespell]
skip = 'docs/*'

[tool.tox]
legacy_tox_ini = """

[tox]
isolated_build = True
envlist = py311, py312, py313, py314, py315

[gh-actions]
python =
  3.11: py311
  3.12: py312
  3.13: py313
  3.14: py314
  3.15: py315


[testenv]
description = Runs test suite parallelized in the specified python environment and 
              against number of available processes (up to 4). 
              Run `tox -e py311 -- -n 0` to run tests in a python 3.11 with 
              parallelization disabled.
passenv = *
setenv =
    py315: UV_EXTRA_INDEX_URL={env:EQUINE_TORCH_INDEX:https://download.pytorch.org/whl/cpu}
    py315: PIP_EXTRA_INDEX_URL={env:EQUINE_TORCH_INDEX:https://download.pytorch.org/whl/cpu}
    py315: UV_INDEX_STRATEGY=unsafe-best-match
extras = tests
commands = pytest tests/ {posargs: -n auto --maxprocesses=4}


[testenv:coverage]
description = Runs test suite and measures test-coverage. Fails if coverage is 
              below 97 percent. Run `tox -e coverage -- -n 0` to disable parallelization.
setenv = NUMBA_DISABLE_JIT=1
usedevelop = true
basepython = python3.11
extras = tests
deps = coverage[toml]
commands = pytest --cov-report term-missing --cov-config=pyproject.toml --cov-fail-under=97 --cov=equine tests {posargs: -n auto --maxprocesses=4}


[testenv:floors]
description = Runs the test suite with every direct dependency at the lowest
              version that pyproject.toml allows (needs tox-uv >= 1.6, which
              CI installs; tests/test_dependency_floors.py fails without it).
basepython = python3.11
uv_resolution = lowest-direct
setenv = EQUINE_CHECK_FLOORS=1
extras = tests
# lowest-direct would install anything listed here at its oldest release
deps =
commands = pytest tests/ {posargs: -n auto --maxprocesses=4}


[testenv:pyright]
description = Ensure that the equine source code under `src/` scans clean
              under pyright and that the public API has a 100 percent
              type-completeness score. The test suite is not scanned.
usedevelop = true
basepython = python3.11
extras =
deps = pyright

commands = pyright src/ --level=error
           pyright --ignoreexternal --level=warning --verifytypes equine

[testenv:format]
description = Applies ruff's autofixes (e.g. removes unused imports) and formats
              the source files and test suite in-place. Running this can help fix a
              failing `enforce-format` run.
skip_install=true
deps =
    # keep in sync with the ruff rev in .pre-commit-config.yaml
    ruff==0.16.9
commands =
    ruff check --fix src/ tests/
    ruff format src/ tests/

[testenv:enforce-format]
description = Ensures that the source code and test suite adhere to formatting
              and code-quality standards.
skip_install=true
basepython=python3.11
deps={[testenv:format]deps}
     codespell==2.4.3
commands=
    ruff format src/ tests/ --diff --check
    ruff check src/ tests/
    codespell src/

[testenv:docs]
description = Uses mkdocs to generate html for the docs. Stores the
              results in `.tox/docs/build/html/`.
basepython=python3.12
extras = docs
commands=
    mkdocs build --clean --strict
"""
